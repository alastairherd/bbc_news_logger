name: Collect BBC News observations

# A Cloudflare Worker cron dispatches this hourly. GitHub's own schedule is unreliable and drops
# many runs, so it remains only as a fallback and skips when a dispatch ran recently.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: bbc-news-collection
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip the fallback schedule after a recent dispatch
        id: fallback
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '50 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scrape_bbc.yml \
            --event workflow_dispatch --created ">=$since" --json databaseId --jq length)"
          if [[ "$recent" != "0" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Collection was dispatched in the last 50 minutes; skipping this delayed schedule."
          fi
      - uses: actions/checkout@v7
        if: steps.fallback.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.fallback.outputs.skip != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked runtime
        if: steps.fallback.outputs.skip != 'true'
        run: uv sync --frozen --no-dev
      - name: Collect, validate, and publish
        if: steps.fallback.outputs.skip != 'true'
        run: uv run --no-sync bbc-news scrape --upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Close any stalled-collection alert
        if: steps.fallback.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for number in $(gh issue list --label collection-alert --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Collection resumed: run ${{ github.run_id }} published a capture."
          done
